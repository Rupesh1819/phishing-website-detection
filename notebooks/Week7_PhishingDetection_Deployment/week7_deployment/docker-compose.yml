version: "3.9"

services:
  phishing-detector:
    build: .
    container_name: phishing_detector
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
    volumes:
      - ./saved_model:/app/saved_model:ro   # mount model artefacts (read-only)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
